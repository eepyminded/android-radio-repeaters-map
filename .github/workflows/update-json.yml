name: Weekly JSON Update

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download latest JSON data
        run: curl -sL https://przemienniki.eu/api/export/json -o app/src/main/assets/przemienniki.eu.json

      - name: Run unit tests to verify JSON formatting
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update przemienniki.eu.json"
          title: "automated data update: przemienniki.eu.json"
          body: "automated PR to update the embedded JSON data. Unit tests passed, confirming data structure is valid."
          branch: "update-json-data"
