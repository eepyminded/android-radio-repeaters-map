name: CI / Quality Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate, Lint & Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate gradle wrapper checksums
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify Java Environment & Gradle Version
        run: |
          java -version
          ./gradlew --version

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify Compile
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Native Binaries in APK
        run: |
          echo "Checking APK for required MapLibre native binaries..."
          if ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "libmaplibre-native-c.so"; then
            echo "ERROR: Missing required libmaplibre-native-c.so in APK!"
            exit 1
          fi
          echo "Native binaries verified successfully."

      - name: Upload Test Reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
