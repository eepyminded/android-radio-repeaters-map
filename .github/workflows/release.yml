name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Attach APK to GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          mkdir -p build/outputs/release-apk

          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "Building APK for $ABI..."
            ./gradlew clean assembleRelease -PtargetAbi=$ABI
            cp app/build/outputs/apk/release/app-release-unsigned.apk build/outputs/release-apk/android-radio-repeaters-map-${{ github.ref_name }}-$ABI.apk
          done

      - name: Rename APK for Release
        run: |
          cd build/outputs/release-apk
          sha256sum *.apk > sha256sums.txt
          cat sha256sums.txt
          echo "### 🔐 Release APK SHA-256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat sha256sums.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/outputs/release-apk/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
